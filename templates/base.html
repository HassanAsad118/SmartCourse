<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCourse - AI Course Recommendation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (FIX ADDED) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Active link styling */
        .active-link {
            color: #ffffff !important;
            border-bottom: 2px solid #8da9c4;
        }
    </style>
</head>

<body style="background-color: #eef4ed; min-height: 100vh; display: flex; flex-direction: column;">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3" style="background-color: #0b2545;">
  <div class="container">

    <a class="navbar-brand fw-bold fs-3" href="{{ url_for('home') }}">
        <span style="color: #8da9c4;">Smart</span>Course
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link px-3 fw-semibold {% if request.endpoint == 'home' %}active-link{% endif %}"
             href="{{ url_for('home') }}">
             Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link px-3 fw-semibold {% if request.endpoint == 'recommend_page' %}active-link{% endif %}"
             href="{{ url_for('recommend_page') }}">
             Recommend
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link px-3 fw-semibold {% if request.endpoint == 'dashboard' %}active-link{% endif %}"
             href="{{ url_for('dashboard') }}">
             Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link px-3 fw-semibold {% if request.endpoint == 'about' %}active-link{% endif %}"
             href="{{ url_for('about') }}">
             About
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container my-5">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="text-light py-4 mt-auto text-center"
        style="background-color: #0b2545; border-top: 4px solid #134074;">
    <div class="container">
        <p class="mb-1 fw-semibold">&copy; 2026 SmartCourse. All rights reserved.</p>
        <p class="small mb-0" style="color: #8da9c4;">
            Final Year AI Project — Course Recommendation System
        </p>
    </div>
</footer>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
